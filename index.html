<html lang="zh-CN">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七号电竞 · 陪玩平台</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e5e7eb; --line-soft:#f1f2f4;
    --text:#16181d; --muted:#6b7280; --muted-2:#9aa1ad;
    --brand:#4f46e5; --brand-soft:#eef0ff; --brand-line:#c9ccff;
    --purple:#7c3aed; --purple-soft:#f5f0ff;
    --gold:#c2410c; --gold-soft:#fff3e8;
    --green:#0f9d58; --green-soft:#eaf7ef;
    --blue:#2563eb; --blue-soft:#eaf1ff;
    --red:#dc2626; --red-soft:#fdecec;
    --amber:#b45309; --amber-soft:#fff7e6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.6 "PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}

  /* ---------- 顶部导航 ---------- */
  .topnav{
    position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .topnav-in{max-width:1180px;margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:26px}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer}
  .brand-mark{
    width:36px;height:36px;border-radius:11px;flex:0 0 36px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
    box-shadow:0 4px 12px rgba(79,70,229,.28);
  }
  .brand-text strong{display:block;font-size:15px;letter-spacing:.2px;line-height:1.2}
  .brand-text span{display:block;font-size:11px;color:var(--muted-2);letter-spacing:.6px}
  .navlinks{display:flex;gap:4px}
  .navlinks button{
    border:0;background:transparent;font-size:13.5px;color:#4a5263;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;
  }
  .navlinks button:hover{background:#f5f6f8}
  .navlinks button.active{background:var(--brand-soft);color:var(--brand)}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .pill{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
  .pill-online{background:var(--green-soft);border-color:#cbe9d6;color:var(--green);font-weight:600}
  .avatar{width:32px;height:32px;border-radius:50%;background:#ebeef4;color:#40485a;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* ---------- 布局 ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:22px 24px 80px}
  .grid{display:grid;gap:16px}
  .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-side{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .sec-title{font-size:13px;font-weight:700;color:#2b3140;margin:22px 0 11px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--brand)}

  .hero{
    border-radius:20px;padding:34px 34px 30px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(125deg,#4f46e5,#7c3aed 62%,#9333ea);
    box-shadow:0 18px 44px rgba(79,70,229,.28);
  }
  .hero::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.11)}
  .hero::before{content:"";position:absolute;right:110px;bottom:-120px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
  .hero .in{position:relative;z-index:1;max-width:640px}
  .hero .kicker{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:650;margin-bottom:15px}
  .hero h1{margin:0;font-size:31px;line-height:1.28;letter-spacing:-.6px}
  .hero p{margin:12px 0 0;font-size:13.5px;line-height:1.85;opacity:.9}
  .hero .acts{display:flex;gap:11px;margin-top:22px;flex-wrap:wrap}
  .hero .acts .btn{background:rgba(255,255,255,.96);border-color:transparent;color:#3b3a8f;font-size:13.5px;padding:10px 20px;font-weight:700}
  .hero .acts .btn.ghost{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff}
  .hero .feats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap;position:relative;z-index:1}
  .hero .ft b{display:block;font-size:20px;font-weight:750;letter-spacing:-.4px}
  .hero .ft span{font-size:11.5px;opacity:.85}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px}
  .card+.card{margin-top:14px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
  .card-h h3{margin:0;font-size:14.5px}
  .card-h .hint{font-size:12px;color:var(--muted-2)}

  .badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:650;white-space:nowrap}
  .b-gray{background:#f1f2f5;color:#5b6371}
  .b-purple{background:var(--purple-soft);color:var(--purple)}
  .b-gold{background:var(--gold-soft);color:var(--gold)}
  .b-green{background:var(--green-soft);color:var(--green)}
  .b-blue{background:var(--blue-soft);color:var(--blue)}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}
  .b-brand{background:var(--brand-soft);color:var(--brand)}

  table.tbl{width:100%;border-collapse:collapse}
  table.tbl th{font-size:11.5px;color:var(--muted);text-align:left;font-weight:650;padding:9px 10px;border-bottom:1px solid var(--line);background:#fbfbfc;white-space:nowrap}
  table.tbl td{padding:11px 10px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
  table.tbl tr:last-child td{border-bottom:0}
  table.tbl td.num{font-variant-numeric:tabular-nums;font-weight:600}
  .tbl-wrap{overflow:auto}

  .btn{
    border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;font-size:12.5px;
    cursor:pointer;color:#31384a;font-weight:600;white-space:nowrap;
  }
  .btn:hover{border-color:#c9cfd9;background:#fcfcfd}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:#443bd0;border-color:#443bd0}
  .btn-lg{padding:11px 22px;font-size:14px;border-radius:11px}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn-block{width:100%}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .acts{display:flex;gap:8px;flex-wrap:wrap}

  /* 服务卡 */
  .svc{border:1px solid var(--line);border-radius:15px;padding:17px;background:#fff;cursor:pointer;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease;position:relative}
  .svc:hover{border-color:var(--brand-line);transform:translateY(-2px);box-shadow:0 12px 26px rgba(79,70,229,.1)}
  .svc.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .svc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .svc .nm{font-size:15px;font-weight:750}
  .svc .pr{font-size:19px;font-weight:750;color:var(--brand);letter-spacing:-.4px;font-variant-numeric:tabular-nums}
  .svc .pr small{font-size:11.5px;color:var(--muted-2);font-weight:600}
  .svc .ds{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px;min-height:40px}
  .svc .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

  /* 步骤 */
  .steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
  .step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .step .n{width:26px;height:26px;border-radius:9px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
  .step .t{font-size:13.5px;font-weight:700;margin-top:10px}
  .step .d{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.7}

  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-size:12.5px;
    cursor:pointer;color:#3c4453;font-weight:500;
  }
  .chip:hover{border-color:#c9cfd9}
  .chip.active{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand);font-weight:700}
  .chip .p{font-size:11px;opacity:.75;margin-left:3px}

  .form-row{margin-bottom:16px}
  .form-row>label.tt{display:block;font-size:12.5px;color:#3c4453;font-weight:700;margin-bottom:9px}
  .chk{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#3c4453;margin-bottom:9px;line-height:1.75;cursor:pointer}
  .chk input{margin-top:3px;width:15px;height:15px;flex:0 0 15px;accent-color:#4f46e5}

  .callout{border-radius:12px;padding:12px 14px;font-size:12.5px;line-height:1.75;border:1px solid}
  .co-info{background:var(--blue-soft);border-color:#d5e3ff;color:#1e40af}
  .co-warn{background:var(--amber-soft);border-color:#f6e3c0;color:#8a5a06}
  .co-danger{background:var(--red-soft);border-color:#f6d4d4;color:#a51f1f}
  .co-ok{background:var(--green-soft);border-color:#cbe9d6;color:#0b6b3f}

  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:8px 0;border-bottom:1px dashed var(--line-soft)}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{font-weight:650;font-variant-numeric:tabular-nums}
  .kv.total span:last-child{font-size:17px;color:var(--brand);font-weight:750}

  .mrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
  .mrow:last-child{border-bottom:0}
  .mrow .score{margin-left:auto;font-weight:750;color:var(--brand);font-variant-numeric:tabular-nums}
  .why{font-size:11px;color:var(--muted-2)}

  .list{display:flex;flex-direction:column;gap:10px}
  .li{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff}
  .li-ic{width:27px;height:27px;flex:0 0 27px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800}
  .li .t{font-size:13px;font-weight:650}
  .li .d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.7}
  .li .right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-shrink:0}

  .empty{color:var(--muted-2);font-size:12.5px;text-align:center;padding:22px 0}
  .foot{max-width:1180px;margin:0 auto;padding:22px 24px 40px;color:var(--muted-2);font-size:11.5px;line-height:1.9;border-top:1px solid var(--line)}
  .foot b{color:#4a5263}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);
    background:#171b26;color:#fff;font-size:13px;padding:10px 17px;border-radius:11px;
    opacity:0;pointer-events:none;transition:.22s;z-index:99;box-shadow:0 8px 26px rgba(0,0,0,.22);max-width:70vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:#0f5132}

  /* ---------- 店铺装修 / 营销（V2 新增） ---------- */
  .banner{position:relative;border-radius:18px;overflow:hidden;height:188px;background:linear-gradient(120deg,#4f46e5,#7c3aed 55%,#db2777);color:#fff;box-shadow:0 14px 34px rgba(79,70,229,.26)}
  .banner .sl{position:absolute;inset:0;opacity:0;transition:opacity .55s ease;display:flex;flex-direction:column;justify-content:center;padding:0 34px}
  .banner .sl.on{opacity:1}
  .banner .sl b{font-size:23px;letter-spacing:-.4px}
  .banner .sl p{margin:8px 0 0;font-size:13px;opacity:.9;max-width:560px}
  .banner .dots{position:absolute;right:20px;bottom:16px;display:flex;gap:6px;z-index:2}
  .banner .dots i{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.45);cursor:pointer;transition:.2s}
  .banner .dots i.on{background:#fff;width:18px}
  .notice{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;margin-top:12px;overflow:hidden}
  .notice .tag{flex:0 0 auto;background:var(--gold-soft);color:var(--gold);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px}
  .notice .track{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
  .notice .track span{display:inline-block;padding-left:100%;animation:marquee 22s linear infinite;font-size:12.5px;color:#4a5263}
  @keyframes marquee{to{transform:translateX(-100%)}}
  .effect-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .effect-row .lb{font-size:12px;color:var(--muted)}
  .fx{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12px;color:#3c4453;cursor:pointer}
  .fx.on{background:var(--purple-soft);border-color:#e2d4ff;color:var(--purple);font-weight:700}

  .coupon{position:relative;display:flex;border:1px solid var(--brand-line);background:linear-gradient(135deg,#f6f5ff,#fdf3ff);border-radius:12px;overflow:hidden}
  .coupon .amt{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--brand);font-weight:750;border-right:1px dashed var(--brand-line)}
  .coupon .amt b{font-size:21px;letter-spacing:-.5px}
  .coupon .amt span{font-size:10.5px;color:var(--muted-2)}
  .coupon .info{flex:1;padding:10px 12px;min-width:0}
  .coupon .info .t{font-size:13px;font-weight:700}
  .coupon .info .d{font-size:11px;color:var(--muted);margin-top:2px}
  .coupon .get{margin:auto 12px auto 0;flex:0 0 auto}
  .coupon.used{filter:grayscale(1);opacity:.62}

  .poster{border:1px dashed var(--brand-line);border-radius:14px;padding:16px;background:linear-gradient(160deg,#eef0ff,#fdf0ff);text-align:center}
  .poster .qr{width:112px;height:112px;margin:10px auto;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted-2);font-size:11px;line-height:1.5}

  .rank-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .rank-row:last-child{border-bottom:0}
  .rank-no{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:#f1f2f5;color:#5b6371}
  .rank-no.g1{background:#fff3e8;color:#c2410c}
  .rank-no.g2{background:#eef0ff;color:#4f46e5}
  .rank-no.g3{background:#eaf7ef;color:#0f9d58}
  .rank-row .rn{font-weight:650;font-size:13px}
  .rank-row .rk{font-size:11px;color:var(--muted-2)}
  .rank-row .rv{margin-left:auto;font-weight:750;color:var(--brand);font-variant-numeric:tabular-nums}

  /* ---------- 登录 / 注册弹窗（两个独立入口） ---------- */
  .auth-mask{
    position:fixed;inset:0;z-index:80;background:rgba(22,24,29,.44);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .auth-mask.show{display:flex}
  .auth-dlg{
    width:100%;max-width:392px;max-height:92vh;overflow:auto;background:#fff;border-radius:18px;
    box-shadow:0 24px 60px rgba(22,24,29,.26);padding:26px 26px 22px;position:relative;
    animation:authIn .2s ease;
  }
  @keyframes authIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
  .auth-dlg .cls{
    position:absolute;right:13px;top:11px;width:28px;height:28px;border:0;background:transparent;
    color:var(--muted-2);font-size:20px;line-height:1;border-radius:8px;cursor:pointer;font-family:inherit;
  }
  .auth-dlg .cls:hover{background:#f3f4f6;color:#3c4453}
  .auth-dlg h2{margin:0;font-size:19px;letter-spacing:-.3px}
  .auth-dlg .sub{margin:6px 0 19px;font-size:12.5px;color:var(--muted);line-height:1.7}
  .auth-dlg .fld{margin-bottom:13px}
  .auth-dlg .fld label{display:block;font-size:12.5px;font-weight:700;color:#3c4453;margin-bottom:6px}
  .auth-dlg .fld input{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:13.5px;
    font-family:inherit;color:var(--text);background:#fff;outline:none;transition:border-color .16s,box-shadow .16s;
  }
  .auth-dlg .fld input::placeholder{color:var(--muted-2)}
  .auth-dlg .fld input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .auth-dlg .fld input.bad{border-color:#e9a3a3;background:#fffafa}
  .auth-dlg .fld .err{display:none;font-size:11.5px;color:var(--red);margin-top:5px;line-height:1.6}
  .auth-dlg .fld .err.show{display:block}
  .auth-dlg .msg{display:none;font-size:12.5px;line-height:1.7;border-radius:10px;padding:9px 12px;margin-bottom:14px}
  .auth-dlg .msg.show{display:block}
  .auth-dlg .msg.err{background:var(--red-soft);border:1px solid #f6d4d4;color:#a51f1f}
  .auth-dlg .msg.ok{background:var(--green-soft);border:1px solid #cbe9d6;color:#0b6b3f}
  .auth-extra{display:flex;justify-content:flex-end;font-size:12px;margin:-2px 0 2px}
  .auth-extra button{border:0;background:transparent;color:var(--muted);font-size:12px;font-family:inherit;cursor:pointer;padding:2px 0}
  .auth-extra button:hover{color:var(--brand)}
  .auth-dlg .go{margin-top:19px}
  .auth-dlg .go .btn{width:100%}
  .auth-switch{margin-top:15px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);text-align:center}
  .auth-switch button{
    border:0;background:transparent;color:var(--brand);font-weight:700;font-size:12.5px;
    font-family:inherit;cursor:pointer;padding:2px 3px;
  }
  .auth-switch button:hover{text-decoration:underline}
  .auth-tip{margin-top:13px;font-size:11.5px;color:var(--muted-2);line-height:1.75;text-align:center}

  @media (max-width:1080px){
    .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g3,.steps{grid-template-columns:repeat(2,minmax(0,1fr))}
    .g-side{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header class="topnav">
  <div class="topnav-in">
    <div class="brand" data-nav="home">
      <div class="brand-mark">7</div>
      <div class="brand-text">
        <strong>七号电竞</strong>
        <span>陪玩平台 · 客户端</span>
      </div>
    </div>
    <nav class="navlinks" id="navigation"></nav>
    <div class="nav-right">
      <div class="pill pill-online">客服在线 12:00—14:00 / 18:00—23:00</div>
      <div id="auth-box" style="display:flex;gap:8px">
        <button class="btn btn-sm btn-primary" id="btn-login">登录</button>

function fieldErr(inputId, errId, msg){
  const input = document.getElementById(inputId);
  const box = document.getElementById(errId);
  if (input) input.classList.toggle('bad', !!msg);
  if (box){ box.textContent = msg || ''; box.classList.toggle('show', !!msg); }
}

function dialogMsg(id, text, kind){
  const box = document.getElementById(id);
  if (!box) return;
  box.textContent = text || '';
  box.className = 'msg' + (text ? ' show ' + (kind || 'err') : '');
}

function setBusy(btnId, busy, label){
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = !!busy;
  if (busy){ btn.dataset.label = btn.dataset.label || btn.textContent; btn.textContent = label || '处理中…'; }
  else if (btn.dataset.label){ btn.textContent = btn.dataset.label; }
}

function clearAuthForm(which){
  const mask = document.getElementById(AUTH_MASK[which]);
  if (!mask) return;
  const form = mask.querySelector('form');
  if (form) form.reset();
  mask.querySelectorAll('input').forEach(i => i.classList.remove('bad'));
  mask.querySelectorAll('.err').forEach(e => { e.textContent = ''; e.classList.remove('show'); });
  const msg = mask.querySelector('.msg');
  if (msg){ msg.textContent = ''; msg.className = 'msg'; }
  setBusy(which === 'login' ? 'login-submit' : 'signup-submit', false);
}

/* 打开指定弹窗（两个弹窗互斥，同一时刻只显示一个） */
function openAuthModal(which){
  Object.keys(AUTH_MASK).forEach(k => {
    const el = document.getElementById(AUTH_MASK[k]);
    if (el) el.classList.remove('show');
    if (k !== which) clearAuthForm(k);
  });
  const el = document.getElementById(AUTH_MASK[which]);
  if (!el) return;
  clearAuthForm(which);
  el.classList.add('show');
  document.body.style.overflow = 'hidden';
  const first = el.querySelector('input');
  if (first) setTimeout(() => first.focus(), 60);
}

function closeAuthModals(){
  Object.values(AUTH_MASK).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('show');
  });
  Object.keys(AUTH_MASK).forEach(clearAuthForm);
  document.body.style.overflow = '';
}

function initSched(){
  state.sched = {};
  DAYS.forEach((d,di)=>{
    const map = {};
    state.staff.forEach((s,si)=>{
      map[s.id] = SLOTS.map((_,slotIdx)=>{
        if(slotIdx>=4) return (si+di)%3!==0;
        if(slotIdx===3) return (si+di)%5!==4;
        if(slotIdx===2) return (si+di)%4!==3;
        return (si+di)%2===0;
      });
    });
    state.sched[d] = map;
  });
}
function daySlotToIdx(slot){
  if(!slot) return 3;
  if(slot.indexOf('12')===0) return 0;
  if(slot.indexOf('16')===0) return 1;
  if(slot.indexOf('18')===0) return 2;
  if(slot.indexOf('20')===0) return 3;
  return 4;
}
/* 匹配预览：与派单引擎同规则（时段 ∩ 排班 ∩ 等级 ∩ 擅长地图） */
function matchCandidates(order){
  const day = DAYS[state.day];
  const si = daySlotToIdx(order.slot);
  const need = order.req==='不限' ? 0 : LVRANK[(order.req||'').replace('+','')] || 0;
  const res = [];
  state.staff.forEach(s=>{
    if(s.status==='离线') return;
    const row = state.sched[day] && state.sched[day][s.id];
    if(!row || !row[si]) return;
    let score = 100; const why = [];
    if(need && LVRANK[s.level] < need){ score -= 26; why.push('等级差 1 档'); } else why.push('等级达标');
    const mapOk = s.maps.indexOf('任意')>=0 || s.maps.indexOf(order.map)>=0 || order.map==='任意';
    if(!mapOk){ score -= 12; why.push('非擅长地图'); } else why.push('地图匹配');
    score -= Math.round(s.bad*3); if(s.bad>2) why.push('差评率偏高');
    res.push({s, score:Math.max(38,Math.min(99,score)), why});
  });
  return res.sort((a,b)=>b.score-a.score).slice(0,3);
}

        <div class="kv" style="margin-top:12px"><span>当前余额</span><span>${money(state.wallet)}</span></div>
        <div class="callout co-warn" style="margin-top:12px">余额充值需接入微信支付商户号，需先完成<strong>个体工商户注册</strong>后才能正式开通；当前为演示占位，不会真实扣款。</div>
      </div>

      <div class="card">
        <div class="card-h"><h3>我的打赏记录</h3><span class="hint">打赏全额给到打手</span></div>
        ${state.tips.map(t=>`<div class="kv"><span>${esc(t.to)}<span style="color:var(--muted-2);font-size:11px">　${esc(t.time)}</span></span><span>${money(t.amount)}</span></div>`).join('') || '<div class="empty">暂无打赏记录</div>'}
        <div class="callout co-info" style="margin-top:12px">打赏为自愿行为，不影响服务质量与派单结果。</div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:14px">
        <div class="card-h"><h3>邀请好友 · 推广返利</h3></div>
        <div class="poster">
          <div style="font-size:14px;font-weight:750">七号电竞 · 陪玩平台</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:4px">扫码进入，新客立减 15 元</div>
          <div class="qr">专属海报<br>二维码占位</div>
          <div style="font-size:11.5px;color:var(--muted)">邀请码 <b style="color:var(--text)">${state.invite.code}</b></div>
          <button class="btn btn-primary btn-block" style="margin-top:12px" data-poster="1">生成我的专属海报</button>
        </div>
        <div class="kv" style="margin-top:12px"><span>返利比例</span><span>好友下单金额 5%</span></div>
        <div class="kv"><span>已邀请</span><span>${state.invite.invited} 人</span></div>
        <div class="kv"><span>累计返利</span><span>${money(state.invite.reward)}</span></div>
        <div class="callout co-info" style="margin-top:12px">好友通过你的海报下单并完成服务后，返利自动结算到余额。</div>
      </div>

      <div class="card">
        <div class="card-h"><h3>会员等级权益</h3></div>
        <div class="kv"><span>普通用户</span><span>无门槛 · 基础服务</span></div>
        <div class="kv"><span>白银会员（当前）</span><span>下单 98 折 · 生日券</span></div>
        <div class="kv"><span>黄金会员</span><span>95 折 · 优先派单 · 专属客服</span></div>
        <div class="kv"><span>钻石会员</span><span>92 折 · 免排队 · 每月打赏券</span></div>
        <div class="callout co-ok" style="margin-top:12px">升级条件：累计消费满 ¥1000 → 黄金；满 ¥3000 → 钻石。等级折扣由后台自定义配置。</div>
        <button class="btn btn-block" style="margin-top:12px" data-nav="rank">查看排行榜 →</button>
      </div>
    </div>
  </div>`;
}

function pageRank(){
  const r = state.ranksD;
  const list = (rows, valFn) => rows.map((x,i)=>`
    <div class="rank-row">
      <div class="rank-no ${i<3?'g'+(i+1):''}">${i+1}</div>
      <div><div class="rn">${esc(x[0])}</div><div class="rk">${esc(x[1]||'')}${x[2]?' · '+esc(x[2]):''}</div></div>
      <div class="rv">${valFn(x)}</div>
    </div>`).join('');
  return `
  <div class="callout co-info" style="margin-bottom:16px">排行榜每小时更新一次。<strong>榜单排名只看服务实力与口碑</strong>，不参与派单权重，也不影响价格。</div>
  <div class="grid g3">
    <div class="card">
      <div class="card-h"><h3>打手接单榜</h3><span class="hint">按累计完成单量</span></div>
      ${list(r.staff, x=>x[3]+' 单')}
    </div>
    <div class="card">
      <div class="card-h"><h3>评价口碑榜</h3><span class="hint">按近 30 天好评率</span></div>
      ${list(r.good, x=>x[3]+'%')}
    </div>
    <div class="card">
      <div class="card-h"><h3>打赏人气榜</h3><span class="hint">按收到打赏金额</span></div>
      ${list(r.tip, x=>money(x[3]))}
    </div>
  </div>
  <div class="card" style="margin-top:16px">
    <div class="card-h"><h3>榜单规则</h3></div>
    <div class="kv"><span>接单榜</span><span>累计已完成订单数，剔除取消单</span></div>
    <div class="kv"><span>口碑榜</span><span>近 30 天好评率，差评核实成立的订单不计分</span></div>
    <div class="kv"><span>打赏榜</span><span>累计收到打赏金额，打赏全额归打手</span></div>
    <div class="callout co-warn" style="margin-top:12px">严禁刷单、刷好评。核实刷榜将清退打手并扣除未结佣金。</div>
  </div>`;
}

/* ========================= 路由 ========================= */
const PAGES = {
  home:['新赛季，找个靠谱的队友','服务与价格 · 下单流程 · 平台保障'],
  book:['预约下单','选服务与时段，系统按排班匹配'],
  my:['我的订单','查看状态 · 确认结单 · 申请售后'],
  member:['会员中心','优惠券 · 余额充值 · 邀请返利 · 会员权益'],
  rank:['排行榜','打手接单榜 · 评价口碑榜 · 打赏人气榜'],
  safety:['服务与安全规则','服务标准 · 打手红线 · 常见问题']
};
const NAVS = [['home','首页'],['book','预约下单'],['my','我的订单'],['member','会员中心'],['rank','排行榜'],['safety','服务与安全规则']];
const RENDER = {home:pageHome, book:pageBook, my:pageMy, member:pageMember, rank:pageRank, safety:pageSafety};

function renderNav(){
  $('#navigation').innerHTML = NAVS.map(n=>
    `<button data-nav="${n[0]}" class="${state.page===n[0]?'active':''}">${n[1]}</button>`).join('');
}
function render(){
  $('#view').innerHTML = RENDER[state.page] ? RENDER[state.page]() : '<div class="empty">页面建设中</div>';
  renderNav();
}
function go(page){ state.page = page; render(); window.scrollTo(0,0); }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-nav],[data-bsvc],[data-bslot],[data-breq],[data-bmap],[data-book],[data-bookreset],[data-pay],[data-confirm],[data-after],[data-urge],[data-banner],[data-fx],[data-usecoupon],[data-recharge],[data-poster]');
  if(!t) return;
  const d = t.dataset;

  if(d.nav){ go(d.nav); return; }
  if(d.banner!==undefined){ state.banner = +d.banner; render(); return; }
  if(d.fx){ state.fx[d.fx] = !state.fx[d.fx]; render(); toast('店铺特效已'+(state.fx[d.fx]?'开启':'关闭'), state.fx[d.fx]); return; }
  if(d.usecoupon){
    const c = state.coupons.find(x=>x.id===d.usecoupon);
    if(c && !c.used){ go('book'); toast('已选中优惠券「'+c.title+'」，下单时自动抵扣'); }
    return;
  }
  if(d.recharge){ toast('演示占位：充值 ¥'+d.recharge+' 需接入微信支付商户号（需个体工商户），当前不产生真实扣款'); return; }
  if(d.poster){ toast('演示占位：专属海报已生成（正式版需接入公众号/服务号后分享）', true); return; }
  if(d.bsvc){ state.booking.svc = d.bsvc; if(state.page!=='book') state.page='book'; render(); return; }
  if(d.bslot){ state.booking.slot = d.bslot; render(); return; }
  if(d.breq){ state.booking.req = d.breq; render(); return; }
  if(d.bmap){ state.booking.map = d.bmap; render(); return; }
  if(d.bookreset){
    state.booking = {svc:'P3',slot:'20—22',req:'魔王+',map:'零号大坝',age:false,risk:false};
    render(); toast('表单已重置'); return;
  }
  if(d.book){
    const b = state.booking;
    if(!b.age || !b.risk){ toast('请先勾选两项确认（年龄核验 + 风险告知）'); return; }
    const svc = svcById(b.svc);
    const id = 'QH-1014-' + String(state.seq++).padStart(2,'0');
    state.myOrders.unshift({
      id, svc:b.svc, slot:b.slot+' 点', amount:svc.price, status:'待付款', date:'10-14',
      map:b.map, guarantee: b.svc==='P3' ? '未达标免费补单/补时或按比例退款' : null
    });
    state.page = 'my'; render();
    toast('预约已提交：' + id + '（待付款），请在订单中完成支付', true);
    return;
  }
  if(d.pay){
    const o = orderById(d.pay); o.status = '待接单'; render();
    toast('支付成功：' + o.id + ' 进入待接单，匹配引擎开始工作', true); return;
  }
  if(d.confirm){
    const o = orderById(d.confirm); o.status = '已完成'; render();
    toast('已确认结单：' + o.id + '，感谢您的支持', true); return;
  }
  if(d.after){ toast('售后申请已提交，客服将在 24 小时内首次响应', true); return; }
  if(d.urge){ toast('已提醒派单，若 15 分钟仍未匹配将自动转派下一位'); return; }
});

document.addEventListener('change', e=>{
  if(e.target.id==='ckAge') state.booking.age = e.target.checked;
  if(e.target.id==='ckRisk') state.booking.risk = e.target.checked;
});

initSched();
render();

/* BANNER 自动轮播（仅切换首页，避免整页重绘） */
setInterval(()=>{
  if(state.page!=='home') return;
  state.banner = (state.banner+1) % BANNERS.length;
  const sls = document.querySelectorAll('.banner .sl');
  const dots = document.querySelectorAll('.banner .dots i');
  if(!sls.length) return;
  sls.forEach((s,i)=>s.classList.toggle('on', i===state.banner));
  dots.forEach((s,i)=>s.classList.toggle('on', i===state.banner));
}, 4200);
</script>
</body>
</html>
