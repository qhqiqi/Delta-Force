<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Supabase Auth 测试</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="auth-box">
    <h3>登录 / 注册</h3>
    <input type="email" id="email" placeholder="邮箱" />
    <input type="password" id="password" placeholder="密码（至少6位）" />
    <button id="btn-login">登录</button>
    <button id="btn-signup">注册</button>
  </div>

  <div id="user-box" style="display:none;">
    <p>已登录：<span id="user-email"></span></p>
    <button id="btn-logout">退出登录</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://你的项目ID.supabase.co';
    const SUPABASE_ANON_KEY = '你的anon key';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function signUp(email, password) {
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) alert('注册失败：' + error.message);
      else alert('注册成功！');
    }

    async function signIn(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) alert('登录失败：' + error.message);
      else location.reload();
    }

    async function signOut() {
      await supabase.auth.signOut();
      location.reload();
    }

    document.getElementById('btn-signup').onclick = () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return alert('请填写邮箱和密码');
      signUp(email, password);
    };

    document.getElementById('btn-login').onclick = () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return alert('请填写邮箱和密码');
      signIn(email, password);
    };

    document.getElementById('btn-logout').onclick = () => {
      signOut();
    };

    supabase.auth.onAuthStateChange((event, session) => {
      const user = session?.user;
      if (user) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('user-box').style.display = 'block';
        document.getElementById('user-email').textContent = user.email;
      } else {
        document.getElementById('auth-box').style.display = 'block';
        document.getElementById('user-box').style.display = 'none';
      }
    });
  </script>

</body>
</html>
